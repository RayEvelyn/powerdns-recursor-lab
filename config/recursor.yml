# Loopback-published demo. Narrow source ACL when serving your actual LAN.
incoming:
  listen: [0.0.0.0]
  port: 53
  allow_from: [127.0.0.0/8, 172.30.53.0/24]
  # Only the dedicated loopback-published Docker demo bridge is allowed.
  # Replace this with your exact trusted client subnet for a real LAN service.
dnssec:
  validation: validate
recursor:
  threads: 2
recordcache:
  max_entries: 10000
  max_ttl: 3600
  max_negative_ttl: 300
packetcache:
  max_entries: 10000
webservice:
  webserver: false
