name: Validate and intentional homelab deployment
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      action:
        description: "Plan first; provision VM separately before pinned-host-key deploy"
        type: choice
        options: [plan, provision, deploy]
        default: plan
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - name: Validate only; no secrets, apply, or self-hosted access
        run: |
          terraform -chdir=terraform fmt -check
          terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform validate
          python3 -m py_compile scripts/*.py
          for script in scripts/*.sh; do bash -n "$script"; done
          docker compose config --quiet
  deploy:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.repository.private &&
      vars.DEPLOY_ENABLED == 'true' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: [self-hosted, linux, homelab]
    environment: homelab
    concurrency:
      group: homelab-${{ github.repository_id }}
      cancel-in-progress: false
    env:
      HOMELAB_ACTION: ${{ inputs.action }}
      HOMELAB_KIND: recursor
      HOMELAB_REPOSITORY_ID: github-${{ github.repository_id }}
      TF_STATE_ROOT: ${{ vars.TF_STATE_ROOT }}
      HOMELAB_TFVARS_JSON: ${{ vars.HOMELAB_TFVARS_JSON }}
      PROXMOX_VE_ENDPOINT: ${{ vars.PROXMOX_VE_ENDPOINT }}
      PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
      PROXMOX_CA_PEM: ${{ secrets.PROXMOX_CA_PEM }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      SSH_PUBLIC_KEY: ${{ vars.SSH_PUBLIC_KEY }}
      HOMELAB_SSH_HOST: ${{ vars.HOMELAB_SSH_HOST }}
      HOMELAB_SSH_USER: ${{ vars.HOMELAB_SSH_USER }}
      HOMELAB_SSH_PORT: ${{ vars.HOMELAB_SSH_PORT }}
      DNS_BIND_IP: ${{ vars.DNS_BIND_IP }}
      DNS_ALLOWED_CIDRS: ${{ vars.DNS_ALLOWED_CIDRS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - run: bash scripts/deploy-ci.sh
