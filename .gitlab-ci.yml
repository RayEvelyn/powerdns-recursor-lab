stages: [validate, deploy]
validate:
  stage: validate
  image:
    name: hashicorp/terraform:1.13.5
    entrypoint: [""]
  script:
    - terraform -chdir=terraform fmt -check
    - terraform -chdir=terraform init -backend=false -input=false
    - terraform -chdir=terraform validate
homelab:
  stage: deploy
  tags: [homelab]
  resource_group: homelab-$CI_PROJECT_ID
  environment: homelab
  variables:
    HOMELAB_KIND: recursor
    HOMELAB_REPOSITORY_ID: $CI_PROJECT_ID
    HOMELAB_ACTION: plan
  rules:
    - if: '$DEPLOY_ENABLED == "true" && $CI_PROJECT_VISIBILITY == "private" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never
  script:
    - bash scripts/deploy-ci.sh
